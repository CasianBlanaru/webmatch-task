version: '3.9'

services:
  app:
    build:
      context: .
    ports:
      - '8000:8080'
    environment:
      APP_ENV: dev
      APP_URL: http://localhost:8000
      DATABASE_URL: mysql://shopware:shopware@db:3306/shopware
      SHOPWARE_ES_ENABLED: 0
      SERVER_NAME: ':8080'
    depends_on:
      - db

  db:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shopware
      MYSQL_USER: shopware
      MYSQL_PASSWORD: shopware
    ports:
      - '3306:3306'
